#                 metals, energy, infra, chemicals, agri, retail, telecom,
#                 internet, real-estate, utilities
#   styles:       value, quality, growth, garp, contrarian, macro, special-situations,
#                 turnaround, deep-value, compounders, cyclicals, demerger
#   horizons:     long-duration (>5y), medium (2-5y), short (<2y)

