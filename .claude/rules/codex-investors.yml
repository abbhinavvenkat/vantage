# Every investor entry below drives the codex pipeline:
#   codex-fetch   → data/codex/raw/<slug>/
#   codex-extract → data/codex/extracted/<slug>/
#   codex-distill → data/codex/distilled/<slug>.json
#   stalwart-profile-update → data/investor_stalwarts/<slug>.md   (✅ COMMITTED)
#
# discovery_mode:
#   fixed                 — pull from explicit seed_urls only
#   youtube-referenced    — also scan transcripts for mentioned investors and queue discovery
#   rss-followed          — subscribe to feed; new posts auto-fetched
#
# license_note guidelines:
#   "Public free letters/blogs/transcripts — full text OK locally"
#   "Citations only — book content not stored in full"
#   "Public regulatory filings — full text OK"
#
# Lines marked `# verify URL` should be checked at first fetch — if the canonical
# URL has moved, codex-fetch logs a warning rather than failing the whole run.
#
# Controlled vocabulary for `applicability_tags`:
#   markets:      all-markets, india, us, developed-mkts, emerging-mkts
#   caps:         all-caps, large-cap, mid-cap, small-cap, micro-cap
